<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Listings</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            padding: 25px 30px;
        }

        .toolbar {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .toolbar select {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 9px 16px;
            cursor: pointer;
        }

        .refresh-btn {
            background: #2874f0;
            color: white;
        }

        .listing-count {
            margin-left: auto;
            color: #666;
        }

        .listing-card {
            background: white;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            overflow: hidden;
        }

        .listing-header {
            padding: 16px;
            display: grid;
            grid-template-columns:
                60px
                1fr
                160px
                130px
                180px
                100px;

            align-items: center;
            gap: 15px;
        }

        .listing-header:hover {
            background: #fafafa;
        }

        .sku {
            font-weight: bold;
        }

        .category {
            color: #666;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-generated {
            background: #d4edda;
            color: #155724;
        }

        .status-other {
            background: #e2e3e5;
            color: #383d41;
        }

        .view-btn {
            background: #2874f0;
            color: white;
        }

        .details {
            display: none;
            border-top: 1px solid #eee;
            padding: 20px;
            background: #fafafa;
        }

        .details.open {
            display: block;
        }

        .details-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 25px;
        }

        .images-section h3,
        .attributes-section h3 {
            margin-top: 0;
            font-size: 16px;
        }

        .image-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .product-image {
            width: 95px;
            height: 95px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: white;
        }

        .attributes-table-wrapper {
            overflow-x: auto;
            max-height: 600px;
            border: 1px solid #ddd;
            background: white;
        }

        .attributes-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        .attributes-table th {
            width: 220px;
            background: #f1f3f5;
            text-align: left;
            font-weight: bold;
        }

        .attributes-table th,
        .attributes-table td {
            padding: 9px 12px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        .attributes-table td {
            word-break: break-word;
        }

        .empty {
            text-align: center;
            padding: 50px;
            color: #777;
            background: white;
            border-radius: 8px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        @media (max-width: 900px) {

            .listing-header {
                grid-template-columns:
                    50px
                    1fr
                    120px
                    100px;
            }

            .listing-header .created {
                display: none;
            }

            .details-layout {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<header class="header">

    <h1>Product Listings</h1>

    <div class="header-actions">

        <button
                class="btn btn-primary"
                onclick="window.location.href='/products/upload'">
            + Add New
        </button>

        <button class="btn btn-success"
                onclick="downloadExcel('earring')">
            ↓ Download Earring Excel
        </button>
        <button class="btn btn-success"
                onclick="downloadExcel('necklace')">
            ↓ Download Necklace Excel
        </button>

    </div>

</header>


<div class="container">

    <div class="toolbar">

        <label for="status">
            Status:
        </label>

        <select id="status">
            <option value="EXCEL_PENDING">
                EXCEL_PENDING
            </option>

            <option value="EXCEL_GENERATED">
                EXCEL_GENERATED
            </option>

            <option value="OTHER">
                OTHER
            </option>
        </select>

        <button class="refresh-btn"
                onclick="loadListings()">
            Refresh
        </button>

        <span class="listing-count"
              id="listingCount">
        </span>

    </div>

    <div id="errorContainer"></div>

    <div id="listingsContainer"></div>

</div>


<script>
    async function downloadExcel(category) {

        const url = category === 'earring'
            ? '/api/v1/excel/earring/download'
            : '/api/v1/excel/necklace/download';

        try {
            const response = await fetch(url);

            if (!response.ok) {
                // Server may return plain text or JSON error
                const contentType = response.headers.get("content-type") || "";

                let message;

                if (contentType.includes("application/json")) {
                    const error = await response.json();
                    message = error.message || error.error || "ERROR: ";
                } else {
                    message = await response.text();
                }

                throw new Error(message);
            }

            // Successful response -> download Excel
            const blob = await response.blob();

            const downloadUrl = window.URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = downloadUrl;

            // Get filename from server
            const disposition = response.headers.get("Content-Disposition");

            let filename = `${category}-products.xls`;

            if (disposition) {
                const match = disposition.match(/filename="?([^"]+)"?/);

                if (match && match[1]) {
                    filename = match[1];
                }
            }

            a.download = filename;
            document.body.appendChild(a);
            a.click();

            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

        } catch (error) {

            console.error("Excel download failed:", error);

            alert(error.message || "Failed to generate Excel file.");
        }
    }

    async function loadListings() {

        const status =
            document.getElementById("status").value;

        const container =
            document.getElementById("listingsContainer");

        const errorContainer =
            document.getElementById("errorContainer");

        const count =
            document.getElementById("listingCount");

        container.innerHTML =
            '<div class="empty">Loading listings...</div>';

        errorContainer.innerHTML = "";

        try {

            const response = await fetch(
                `/api/v1/listings?status=${encodeURIComponent(status)}`
            );

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}: ${await response.text()}`
                );
            }

            const listings =
                await response.json();

            count.textContent =
                `${listings.length} listing(s)`;

            renderListings(listings);

        } catch (error) {

            console.error(error);

            count.textContent = "";

            errorContainer.innerHTML = `
                <div class="error">
                    Failed to load listings.
                    ${escapeHtml(error.message)}
                </div>
            `;

            container.innerHTML = "";
        }
    }


    function renderListings(listings) {

        const container =
            document.getElementById("listingsContainer");

        if (!listings || listings.length === 0) {

            container.innerHTML =
                '<div class="empty">No listings found.</div>';

            return;
        }

        container.innerHTML =
            listings
                .map((listing, index) =>
                    createListingCard(listing, index)
                )
                .join("");
    }


    function createListingCard(listing, index) {

        const statusClass =
            getStatusClass(listing.status);

        const images =
            listing.imageUrls || [];

        const listingData =
            listing.listingData || {};

        return `
            <div class="listing-card">

                <div class="listing-header">

                    <div>
                        ${escapeHtml(listing.id)}
                    </div>

                    <div class="sku">
                        ${escapeHtml(listing.sellerSkuId)}
                    </div>

                    <div class="category">
                        ${escapeHtml(listing.category)}
                    </div>

                    <div>
                        <span class="status ${statusClass}">
                            ${escapeHtml(listing.status)}
                        </span>
                    </div>

                    <div class="created">
                        ${formatDate(listing.createdAt)}
                    </div>

                    <div>
                        <button
                            class="view-btn"
                            onclick="toggleDetails(${index})">
                            View
                        </button>
                    </div>

                </div>


                <div
                    id="details-${index}"
                    class="details">

                    <div class="details-layout">

                        <div class="images-section">

                            <h3>Product Images</h3>

                            <div class="image-gallery">

                                ${
            images.length
                ? images.map(url => `
                                        <a
                                            href="${escapeAttribute(url)}"
                                            target="_blank">

                                            <img
                                                class="product-image"
                                                src="${escapeAttribute(url)}"
                                                alt="Product image">

                                        </a>
                                    `).join("")
                : "<p>No images</p>"
        }

                            </div>

                        </div>


                        <div class="attributes-section">

                            <h3>
                                Listing Data
                                (${Object.keys(listingData).length}
                                fields)
                            </h3>

                            <div class="attributes-table-wrapper">

                                <table
                                    class="attributes-table">

                                    <thead>
                                        <tr>
                                            <th>Field</th>
                                            <th>Value</th>
                                        </tr>
                                    </thead>

                                    <tbody>

                                        ${
            Object.entries(listingData)
                .map(([key, value]) => `
                                                    <tr>
                                                        <th>
                                                            ${escapeHtml(key)}
                                                        </th>

                                                        <td>
                                                            ${formatValue(value)}
                                                        </td>
                                                    </tr>
                                                `)
                .join("")
        }

                                    </tbody>

                                </table>

                            </div>

                        </div>

                    </div>

                </div>

            </div>
        `;
    }


    function toggleDetails(index) {

        const element =
            document.getElementById(`details-${index}`);

        element.classList.toggle("open");
    }


    function getStatusClass(status) {

        switch (status) {

            case "EXCEL_PENDING":
                return "status-pending";

            case "EXCEL_GENERATED":
                return "status-generated";

            default:
                return "status-other";
        }
    }


    function formatValue(value) {

        if (value === null ||
            value === undefined ||
            value === "") {

            return `<span style="color:#999">-</span>`;
        }

        if (typeof value === "object") {

            return escapeHtml(
                JSON.stringify(value)
            );
        }

        return escapeHtml(String(value));
    }


    function formatDate(value) {

        if (!value) {
            return "-";
        }

        try {

            return new Date(value)
                .toLocaleString();

        } catch (e) {

            return value;
        }
    }


    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {

            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function escapeAttribute(value) {
        return escapeHtml(value);
    }


    // Load when page opens
    loadListings();

</script>

</body>

</html>
