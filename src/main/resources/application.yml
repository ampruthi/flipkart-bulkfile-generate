spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flipkart_uploader}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

app:
  excel:
    template: classpath:templates/C_earring_1eeefffca65b48c4_1809-1643FK_REQXQFJK8HQTF.xls
    necklace-template: classpath:templates/C_necklace-chain_1eeefffca65b48c4_2009-1827FK_REQOL9KHOTXYE.xls
    output-dir: ./output

  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-5.4}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:medium}

dropbox:
  app-key: ${DROPBOX_APP_KEY:dq7e541o7judajy}
  app-secret: ${DROPBOX_APP_SECRET:d2hc1u8rksscw6b}
  refresh-token: ${DROPBOX_REFRESH_TOKEN}
  folder: ${DROPBOX_FOLDER:/Flipkart-naarinest-media}

server:
  port: 8080
